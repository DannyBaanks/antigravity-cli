name: agy-dash CI

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/agy-dash/**"
      - ".github/workflows/agy-dash-ci.yml"
  push:
    branches: [main]
    paths:
      - "tools/agy-dash/**"
      - ".github/workflows/agy-dash-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          python -m pip install --upgrade pip pytest

      - name: Run Zig core tests
        working-directory: tools/agy-dash/zig_core
        run: zig build test

      - name: Run agy-dash test suite
        working-directory: tools/agy-dash
        run: python -m pytest -v
